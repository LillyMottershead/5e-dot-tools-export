[project]
name = "fivet"
version = "0.1.0"
description = "CLI for looking up D&D 5e spells from 5etools data and exporting them as markdown"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "platformdirs>=4.2.0",
    "pydantic>=2.7.0",
    "rapidfuzz>=3.9.0",
    "rich>=13.7.0",
]

[project.scripts]
"5et" = "fivet.cli:main"
fivetools = "fivet.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "respx>=0.21.1",
    "ruff>=0.5.0",
    "syrupy>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fivet"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
